<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노트 아카이브 PDF 뷰어</title>
    <!-- PDF.js CDN 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      /* 기본 레이아웃 */
      :root {
        --bg: #f7f7f8;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      /* PDF 렌더링 영역 */
      .viewer {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        overflow: hidden;
      }
      canvas {
        max-width: 100%;
        height: auto;
        transition: opacity 0.2s ease;
      }
      /* 로딩/에러 오버레이 */
      .overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.9);
        z-index: 2;
        flex-direction: column;
        gap: 8px;
        text-align: center;
        padding: 16px;
      }
      .overlay.show {
        display: flex;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 컨트롤 영역 */
      .controls {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .controls-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      input[type="number"] {
        width: 80px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        text-align: center;
      }
      .page-info {
        color: var(--muted);
        font-size: 14px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 640px) {
        .app {
          padding: 12px;
        }
        .viewer {
          min-height: 50vh;
        }
        button,
        input[type="number"] {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <!-- PDF 렌더링 영역 -->
      <section class="viewer" aria-live="polite">
        <canvas id="pdf-canvas"></canvas>
        <div id="overlay" class="overlay show">
          <div class="spinner" aria-hidden="true"></div>
          <div id="overlay-text">PDF 불러오는 중...</div>
        </div>
      </section>

      <!-- 네비게이션 컨트롤 영역 -->
      <section class="controls">
        <div class="controls-row">
          <button id="prev-page" type="button">← 이전</button>
          <input id="page-input" type="number" min="1" value="1" />
          <span class="page-info">/ <span id="total-pages">-</span></span>
          <button id="next-page" type="button">다음 →</button>
        </div>
        <div class="controls-row">
          <button id="zoom-out" type="button">축소</button>
          <button id="zoom-in" type="button">확대</button>
        </div>
        <div class="hint">키보드: ←/→ 페이지 이동, +/- 확대/축소</div>
      </section>
    </main>

    <script>
      // PDF.js 워커 설정
      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      // PDF URL (필요 시 이 값을 바꾸면 됩니다)
      const PDF_URL =
        "https://collection.cloudinary.com/djpgxjwpd/33f289906b9db05733069302194ddf5f";
      // CORS 우회용 프록시 (직접 로드 실패 시 사용)
      const CORS_PROXY = "https://api.allorigins.win/raw?url=";

      // DOM 요소
      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayText = document.getElementById("overlay-text");
      const prevBtn = document.getElementById("prev-page");
      const nextBtn = document.getElementById("next-page");
      const pageInput = document.getElementById("page-input");
      const totalPagesEl = document.getElementById("total-pages");
      const zoomInBtn = document.getElementById("zoom-in");
      const zoomOutBtn = document.getElementById("zoom-out");

      // 상태 값
      let pdfDoc = null;
      let pageNum = 1;
      let pageRendering = false;
      let pageNumPending = null;
      let scale = 1.2;
      let usingProxy = false;

      // UI 상태 업데이트
      function updateControls() {
        prevBtn.disabled = pageNum <= 1 || pageRendering;
        nextBtn.disabled = !pdfDoc || pageNum >= pdfDoc.numPages || pageRendering;
        pageInput.value = pageNum;
        totalPagesEl.textContent = pdfDoc ? pdfDoc.numPages : "-";
      }

      function showOverlay(message) {
        overlayText.textContent = message;
        overlay.classList.add("show");
      }

      function hideOverlay() {
        overlay.classList.remove("show");
      }

      // 페이지 렌더링
      function renderPage(num) {
        pageRendering = true;
        updateControls();
        canvas.style.opacity = "0.2";

        pdfDoc.getPage(num).then((page) => {
          const viewport = page.getViewport({ scale });
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          const renderContext = {
            canvasContext: ctx,
            viewport,
          };

          const renderTask = page.render(renderContext);
          renderTask.promise.then(() => {
            pageRendering = false;
            canvas.style.opacity = "1";
            updateControls();
            if (pageNumPending !== null) {
              const pending = pageNumPending;
              pageNumPending = null;
              renderPage(pending);
            }
          });
        });
      }

      // 렌더링 큐 관리
      function queueRenderPage(num) {
        if (pageRendering) {
          pageNumPending = num;
        } else {
          renderPage(num);
        }
      }

      // 페이지 이동
      function goToPage(num) {
        if (!pdfDoc) return;
        if (num < 1 || num > pdfDoc.numPages) return;
        pageNum = num;
        queueRenderPage(pageNum);
        updateControls();
      }

      // 확대/축소
      function changeZoom(delta) {
        const nextScale = Math.min(3, Math.max(0.6, scale + delta));
        if (nextScale === scale) return;
        scale = nextScale;
        queueRenderPage(pageNum);
      }

      // PDF 로드 (CORS 실패 시 프록시 재시도)
      async function loadPdf(url) {
        try {
          showOverlay("PDF 불러오는 중...");
          const loadingTask = pdfjsLib.getDocument({
            url,
            withCredentials: false,
          });
          pdfDoc = await loadingTask.promise;
          pageNum = 1;
          updateControls();
          hideOverlay();
          renderPage(pageNum);
        } catch (err) {
          if (!usingProxy) {
            usingProxy = true;
            const proxiedUrl = CORS_PROXY + encodeURIComponent(PDF_URL);
            loadPdf(proxiedUrl);
            return;
          }
          showOverlay("PDF 로드 실패. 네트워크/URL을 확인해주세요.");
          console.error("PDF load error:", err);
        }
      }

      // 버튼 이벤트
      prevBtn.addEventListener("click", () => {
        if (pageNum <= 1) return;
        goToPage(pageNum - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
        goToPage(pageNum + 1);
      });

      pageInput.addEventListener("change", (event) => {
        const value = parseInt(event.target.value, 10);
        if (!Number.isNaN(value)) {
          goToPage(value);
        } else {
          pageInput.value = pageNum;
        }
      });

      pageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const value = parseInt(pageInput.value, 10);
          if (!Number.isNaN(value)) {
            goToPage(value);
          }
        }
      });

      zoomInBtn.addEventListener("click", () => changeZoom(0.2));
      zoomOutBtn.addEventListener("click", () => changeZoom(-0.2));

      // 키보드 단축키
      document.addEventListener("keydown", (event) => {
        if (document.activeElement === pageInput) return;
        if (event.key === "ArrowLeft") {
          goToPage(pageNum - 1);
        } else if (event.key === "ArrowRight") {
          goToPage(pageNum + 1);
        } else if (event.key === "+" || event.key === "=") {
          changeZoom(0.2);
        } else if (event.key === "-") {
          changeZoom(-0.2);
        }
      });

      // 초기 로드
      loadPdf(PDF_URL);
    </script>
  </body>
</html>
